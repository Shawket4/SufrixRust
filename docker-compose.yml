# Production compose — all Madar services.
#
# Prerequisites on the VPS before first `up`:
#   1. /opt/madar-rust/.env  — copy from .env.example and fill in secrets
#                               DATABASE_URL must use host.docker.internal, not localhost
#   2. /opt/madar-rust/uploads/  — existing upload directory (nginx serves from here)
#   3. /opt/shlink/data/          — existing Shlink SQLite data
#   4. /opt/osrm/                 — pre-processed Egypt map (egypt-latest.osrm*)
#   5. /opt/madar-whatsapp/      — persistent WhatsApp session directory
#
# To build the WhatsApp image (one-time, or after source changes):
#   docker compose build madar-whatsapp
#
# Normal deploy (backend only — triggered by CI):
#   docker compose up -d --no-deps madar-backend

services:
  madar-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/shawket4/madarrust:latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /opt/madar-rust/uploads:/app/uploads
      # Apple Wallet signing material, read-only. The backend reads these by
      # PATH (LOYALTY_APPLE_*_FILE) rather than as inline PEM, so a private key
      # never has to have its newlines escaped into an env var — where it would
      # also show up in `docker inspect` and any process listing.
      - /opt/madar-rust/WalletCerts:/run/secrets:ro
    env_file: .env
    environment:
      # Override localhost URLs from .env with container-network addresses
      OSRM_URL: http://osrm:5000
      SHLINK_BASE_URL: http://shlink:8080
      WHATSAPP_SERVICE_URL: http://madar-whatsapp:8090
    networks:
      - madar-net

  madar-whatsapp:
    image: ${WHATSAPP_IMAGE:-ghcr.io/shawket4/madar-whatsapp:latest}
    restart: unless-stopped
    volumes:
      - /opt/madar-whatsapp:/app/data
    environment:
      WA_STORE: /app/data/whatsapp-store.db
      WA_META: /app/data/whatsapp-sessions.json
      # Must match WHATSAPP_AUTH_HEADER in the backend .env
      WA_AUTH_TOKEN: ${WHATSAPP_AUTH_HEADER}
    networks:
      - madar-net

  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    # publicly accessible — other projects call OSRM directly from their frontends
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - /opt/osrm:/data
    command: osrm-routed --algorithm mld /data/egypt-latest.osrm
    networks:
      - madar-net

  shlink:
    image: shlinkio/shlink:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /opt/shlink/data:/etc/shlink/data
    environment:
      DB_DRIVER: sqlite
      DEFAULT_DOMAIN: s.shawket.duckdns.org
      IS_HTTPS_ENABLED: "true"
      INITIAL_API_KEY: ${SHLINK_API_KEY}
    networks:
      - madar-net

  shlink-web-client:
    image: shlinkio/shlink-web-client:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    networks:
      - madar-net

networks:
  madar-net:
    driver: bridge
