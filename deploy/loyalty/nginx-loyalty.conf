# loyalty.madar-pos.cloud → the public loyalty signup site, built from
# MadarDashboard (`npm run build:loyalty` → `dist-loyalty`) and deployed to
# /var/www/madar-loyalty. SPA fallback to loyalty.html.
#
# A separate origin from the dashboard on purpose, the same reason ordering and
# reservations have their own: this page is opened by anyone who scans a QR on a
# counter, and it must not be able to load admin code or share cookies,
# localStorage or an auth token with the management app.
#
#   sudo cp nginx-loyalty.conf /etc/nginx/sites-available/loyalty.madar-pos.cloud
#   sudo ln -sf /etc/nginx/sites-available/loyalty.madar-pos.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d loyalty.madar-pos.cloud   # after DNS resolves

server {
    listen 80;
    server_name loyalty.madar-pos.cloud;

    root /var/www/madar-loyalty;
    # The entry is loyalty.html, not index.html — the build has one input and
    # keeps its name, exactly like the ordering and reservations bundles.
    index loyalty.html;

    # Apple refuses a pass served under any other type, and some proxies will
    # happily hand back `application/octet-stream` and leave the customer with a
    # file iOS will not open.
    location ~* \.pkpass$ {
        default_type application/vnd.apple.pkpass;
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:8080;
    }

    # The pass download and the signup form both talk to the backend. Same-origin
    # so the page needs no CORS grant and the member token never crosses origins.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The public endpoints are rate-limited per IP; without this every
        # customer would share the proxy's address and one scan would exhaust
        # the budget for the whole branch.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /loyalty.html;
    }
}
